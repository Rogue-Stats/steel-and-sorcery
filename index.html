<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Steel &amp; Sorcery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Steel &amp; Sorcery">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120e15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen MMO-style idle RPG. Canvas battlefield above (folded/narrow) or beside (unfolded/wide) a gold-trimmed tabbed panel. Deliberately single dark theme. */
:root{
  --bg:#120e15; --panel:#1a1418; --card:#241c1d; --card2:#2e2425;
  --line:#7a5d33; --line2:#46372a; --gold:#f3c95a; --gold2:#c98d2a;
  --text:#eee4d3; --muted:#a3937f; --good:#5fd47a; --bad:#ff6b6b; --quest:#ffd23f;
  --display:"Pixelify Sans", "Courier New", monospace;
  --body:"Alegreya Sans", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{touch-action:manipulation}
body{background:var(--bg);color:var(--text);font:15px/1.35 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}

#app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:minmax(0,52fr) minmax(0,48fr);gap:10px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:640px){#app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:14px;padding-block:12px}}

#battle{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.bhead{display:flex;align-items:center;gap:8px}
.zinfo{flex:1;min-width:0}
h1{font:800 1.18rem/1.1 var(--display);color:var(--gold);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
#subtxt{font-size:.74rem;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subtxt.hot{color:#ffae4a}
.goldb{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:#0009;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.coin{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff3a8,var(--gold) 45%,var(--gold2));box-shadow:0 0 0 1px #8a5a12;flex:none}
#leave{font-weight:800;font-size:.76rem;padding:5px 10px;border-radius:8px;color:var(--bad);border:1px solid #7a3c3c;background:#ff6b6b14;white-space:nowrap}
#chips{display:flex;gap:6px;overflow:hidden;min-height:22px}
.chip{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);background:#0007;color:var(--text);white-space:nowrap;flex:none}
.chip b{font-weight:800}
.chip.q{border-color:#8a7420;color:var(--quest)}
.chip.q.done{background:var(--quest);color:#1a1404;border-color:var(--quest)}
#field{position:relative;flex:1;min-height:110px;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px #0007;background:#0b0809}
#cv{display:block;width:100%;height:100%;touch-action:manipulation;cursor:crosshair;image-rendering:pixelated;image-rendering:crisp-edges}
.por,.pk img{image-rendering:pixelated;border-radius:6px!important}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:5px 12px;border-radius:99px;background:#000c;border:1px solid var(--gold);font-size:.8rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#party{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.pc{display:flex;flex-direction:column;gap:3px;padding:5px 7px;border-radius:9px;background:var(--card);border:1px solid var(--line2);min-width:0}
.pc .top{display:flex;justify-content:space-between;gap:4px;font-weight:800;font-size:.74rem}
.pc .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .lv{color:var(--gold);font-variant-numeric:tabular-nums;flex:none}
.pc .nx{font-size:.64rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.down{opacity:.5}
.bar{height:6px;border-radius:9px;background:#0009;overflow:hidden;box-shadow:inset 0 0 0 1px #0008}
.bar>i{display:block;height:100%;border-radius:9px}
.bar.hp>i{background:linear-gradient(#7ee08f,#3fae55)}
.bar.xp{height:4px}.bar.xp>i{background:#9d6bff}
#xpline{display:flex;align-items:center;gap:8px;font-size:.66rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
#xpline .bar{flex:1}
#log{background:#0008;border-radius:8px;padding:5px 8px;font-size:.74rem;line-height:1.35;height:calc(3 * 1.35em);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;flex:none}
#log div{flex:none;min-height:1.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:640px){#log{height:calc(8 * 1.35em)}}

#panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px #0007}
#townv{flex:1;min-height:0;position:relative;background:#0b0809}
#tcv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
.crumb{display:flex;align-items:center;gap:10px;margin:-4px 0 -2px}
.crumb b{font:700 1rem var(--display);color:var(--gold)}
#content{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line2);background:#0006}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:var(--muted);font-size:.62rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;position:relative}
#tabs button svg{font-size:18px}
#tabs button.on{color:var(--gold)}
#tabs button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--gold);border-radius:2px}
#tabs .dot{position:absolute;top:4px;right:calc(50% - 17px);min-width:8px;height:8px;border-radius:9px;background:var(--quest)}

h2{font:800 1rem/1.15 var(--display);color:var(--gold);margin:0;letter-spacing:.03em}
h3{font:800 .96rem/1.15 var(--body);margin:0}
small,.muted{color:var(--muted);font-size:.76rem}
.card{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.trim{border-color:var(--line);background:linear-gradient(var(--card2),var(--card))}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.pills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pill{background:#0006;border:1px solid var(--line2);border-radius:8px;padding:6px 4px;text-align:center;min-width:0}
.pill b{display:block;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill span{display:block;font-size:.56rem;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.por{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);background:#0006;flex:none}
.lvbig{font:800 1.2rem var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.gs{width:42px;height:42px;border-radius:7px;background:#0007;display:grid;place-items:center;position:relative;border:1.5px solid var(--line2);font-size:18px;color:#5a4d40;flex:none}
.gs em{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:.58rem;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:.86rem;padding:9px 12px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}
.btn.gold{color:#1a1004;background:linear-gradient(var(--gold),var(--gold2))}
.btn.ghost{color:var(--gold);background:#0005}
.btn:disabled{color:#fff6;background:#ffffff12;border-color:var(--line2)}
.btn.sm{font-size:.74rem;padding:5px 10px;border-radius:99px}
.btn.green{color:var(--good);border-color:#3c7a49;background:#5fd47a1a}
.btn.red{color:var(--bad);border-color:#7a3c3c;background:#ff6b6b14}
.btn.warn{color:#1a1004;background:linear-gradient(#ffb36b,#e07a2a);border-color:#a85a1f}
.btn.full{width:100%}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;font-weight:700;text-align:left}
.sw{width:44px;height:26px;border-radius:99px;background:#ffffff1f;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#ddd;transition:transform .2s}
.sw.on{background:var(--gold2)}.sw.on::after{transform:translateX(18px);background:#fff4d0}

.els{display:flex;gap:6px;flex-wrap:wrap}
.elb{padding:5px 12px;border-radius:99px;border:1.5px solid color-mix(in srgb,var(--ec) 45%,transparent);color:var(--ec);font-weight:800;font-size:.8rem;background:#0005}
.elb.on{background:color-mix(in srgb,var(--ec) 22%,#0000);border-color:var(--ec);box-shadow:0 0 10px color-mix(in srgb,var(--ec) 35%,transparent)}
.loadout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ls{border:1.5px solid var(--line2);border-radius:9px;background:#0006;display:flex;flex-direction:column;min-width:0}
.ls.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.ls .sn{padding:7px 6px 4px;text-align:left;font-weight:800;font-size:.78rem;line-height:1.15;min-height:2.6em;display:flex;gap:5px}
.ls .sn i{font-style:normal;color:var(--gold)}
.ls .mv{display:flex;border-top:1px solid var(--line2)}
.ls .mv button{flex:1;padding:4px 0;color:var(--muted);font-size:.8rem}
.ls .mv button:disabled{opacity:.25}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.sk{text-align:left;padding:8px 9px;border-radius:9px;border:1px solid var(--line2);background:#0004;display:flex;flex-direction:column;gap:2px;min-width:0}
.sk b{font-size:.82rem}.sk span{font-size:.7rem;color:var(--muted);line-height:1.25}
.sk .tag{font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.sk.lock{opacity:.45}.sk.eq{border-color:#8a6b2a;background:#f3c95a0f}
.rk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 9px;border-radius:9px;background:#0004;border:1px solid var(--line2)}

.gr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px;border-radius:10px;background:var(--card);border:1px solid var(--line2)}
.nm{font-weight:800;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.df{font-size:.68rem;font-weight:800}
.acts{display:flex;flex-direction:column;gap:5px}

.tal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tc{text-align:left;padding:10px;border-radius:10px;border:1px solid var(--line2);background:var(--card);display:flex;flex-direction:column;gap:4px;min-width:0}
.tc.can{border-color:#3c7a49;box-shadow:0 0 0 1px #3c7a4966 inset}
.tc b{font-size:.84rem}.tc span{font-size:.7rem;color:var(--muted)}
.pips{display:flex;gap:3px}.pips i{width:12px;height:5px;border-radius:2px;background:#ffffff1c}.pips i.on{background:var(--gold)}

.qc{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line2)}
.qc.active{border-color:#8a7420}
.qc.ready{border-color:var(--quest);box-shadow:0 0 0 1px var(--quest) inset}
.qc.locked{opacity:.55}
.qh{display:flex;gap:8px;align-items:flex-start}
.qmark{font:800 1.1rem/1 var(--display);color:var(--quest);width:16px;flex:none;text-align:center}
.qt{font-weight:800;font-size:.88rem}
.qr{font-size:.68rem;color:var(--muted);font-weight:700}
.req{font-size:.66rem;font-weight:800;color:var(--bad)}

.dc{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line2)}
.dc.sel{border-color:var(--gold)}
.slotp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 9px;border-radius:9px;background:#0005;border:1px dashed var(--line2);min-height:40px}
.slotp.filled{border-style:solid}
.cdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:1.5px solid currentColor;flex:none}
.role{font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:99px;border:1px solid currentColor}
.on-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:4px;box-shadow:0 0 6px var(--good)}
.zl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;background:#0004;border:1px solid var(--line2);text-align:left;width:100%}
.zl.here{border-color:var(--gold)}
.zl:disabled{opacity:.45}
.zdot{width:14px;height:14px;border-radius:50%;justify-self:center;box-shadow:0 0 8px currentColor}

#modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:20;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mbox{width:min(400px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;background:linear-gradient(var(--card2),var(--panel));border:1px solid var(--gold);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:center}
.mbox h2{font-size:1.3rem}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.pk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;border:1.5px solid var(--line2);background:#0005}
.pk img{width:52px;height:52px}
.pk b{font-size:.84rem}.pk span{font-size:.64rem;color:var(--muted)}
.pk.on{border-color:var(--gold);background:#f3c95a14;box-shadow:0 0 12px #f3c95a40}
.dollwrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.dcol{display:flex;flex-direction:column;gap:8px}
.dslot{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.58rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dslot .gs{width:48px;height:48px;font-size:20px}
.ghostslot{width:48px;justify-content:center;height:62px;border:1px dashed var(--line2);border-radius:8px}
.ghostslot b{font-size:.8rem;color:var(--text);letter-spacing:0}
.dcenter{display:grid;place-items:center;background:radial-gradient(60% 55% at 50% 60%,#f3c95a22,transparent 70%);border-radius:12px;min-width:0}
.doll{width:min(100%,200px);aspect-ratio:40/36;height:auto;image-rendering:pixelated;max-width:100%}
.doll.sm{width:120px}
.dfig{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.dfig figcaption{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tip{text-align:left;background:#0b0809;border:1px solid var(--rc,var(--line2));border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.tip.empty{text-align:center}
.tip .st{font-size:.76rem;color:var(--good)}
.cands{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:9px;border:1px solid var(--line2);background:#0005}
.cand.on{border-color:var(--gold);background:#f3c95a14}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.srow{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;padding:3px 0;border-bottom:1px solid #ffffff10;min-width:0}
.srow span{color:var(--muted)}
.srow b{font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#snd{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#0009;color:var(--gold);display:grid;place-items:center;flex:none}
#snd svg{font-size:16px}
#snd.off{color:var(--muted)}
#fx{position:fixed;inset:0;z-index:30;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.fan{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;animation:fanIn .5s cubic-bezier(.2,1.6,.4,1) both;text-align:center;padding:0 16px}
.fan.out{animation:fanOut .4s ease-in both}
.fan .rays{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(from 0deg,var(--fc) 0 7deg,transparent 7deg 20deg);opacity:.16;animation:spin 8s linear infinite;-webkit-mask:radial-gradient(circle,#000 0 12%,transparent 55%);mask:radial-gradient(circle,#000 0 12%,transparent 55%)}
.fant{position:relative;font:700 clamp(2rem,9vw,3.4rem)/1 var(--display);color:var(--fc);text-shadow:3px 3px 0 #120a0e,-2px -2px 0 #120a0e,2px -2px 0 #120a0e,-2px 2px 0 #120a0e,0 0 24px var(--fc);letter-spacing:.04em}
.fans{position:relative;font:800 1rem var(--body);color:#fff;text-shadow:2px 2px 0 #120a0e;background:#000a;border:1px solid var(--fc);padding:4px 12px;border-radius:99px;max-width:90vw}
.cf{position:absolute;left:50%;top:50%;width:6px;height:6px;animation:conf 1.4s ease-out both}
@keyframes fanIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fanOut{to{opacity:0;transform:scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 120px)) rotate(540deg);opacity:0}}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rcard{width:96px;height:126px;perspective:600px;flex:none}
.rin{position:relative;display:block;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.rcard.on .rin{transform:rotateY(180deg)}
.rback,.rfront{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;box-sizing:border-box}
.rback{background:repeating-linear-gradient(45deg,#3a2a18 0 6px,#2a1e12 6px 12px);border:2px solid var(--gold);color:var(--gold);font:700 2rem var(--display);box-shadow:0 0 0 2px #120a0e inset}
.rcard:not(.on) .rback{animation:wob 1.6s ease-in-out infinite}
.rfront{transform:rotateY(180deg);background:#0b0809;border:2px solid var(--rc);box-shadow:0 0 16px color-mix(in srgb,var(--rc) 45%,transparent)}
.rfront b{font-size:.72rem;line-height:1.15;color:var(--rc);text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.rfront small{font-size:.6rem}
@keyframes wob{50%{transform:translateY(-3px)}}

function makeGear(lvl, r, cls){
  cls = cls || S.cls; const slot=pick(SLOTS);
  const st = r>=2 ? rollStats(r) : null;
  let name = pick(RAR[r].pre)+' '+pick(BASES[cls][slot]); if(st) name+=' '+STATS[Object.keys(st)[0]].suf;
  return {id:uid(), name, cls, slot, r, st, ilvl:Math.max(1, Math.round(lvl + RAR[r].b))};
}
function receive(g, quiet){
  if(!quiet && B && time-LASTKILL.t<0.05){ B.fx.push({t:'loot', x:LASTKILL.x, col:RAR[g.r].c, r:g.r, life:1.6, max:1.6}); }
  if(!quiet){ sfx('loot', g.r); if(g.r>=3) fanfare(g.r===4?'LEGENDARY!':'EPIC LOOT!', g.name, RAR[g.r].c); }
  if(g.kind==='recipe'){ if(!quiet){ toast(g.name, RAR[g.r].c); } log(`You receive recipe: [${g.name}]${canLearn(g)?' (learn it from your bags)':''}`, RAR[g.r].c); S.bags.push(g); trimBags(); return; }
  if(!quiet){ toast(g.name, RAR[g.r].c); log(`You receive: [${g.name}]`, RAR[g.r].c); }
  if(S.autoEquip && isUp(g)){ equip(g); log(`Equipped ${g.name} (item level ${g.ilvl}).`, RAR[g.r].c); }
  else { S.bags.push(g); trimBags(); }
}
function trimBags(){ if(S.bags.length<=50) return; S.bags.sort((a,b)=>b.ilvl-a.ilvl); const extra=S.bags.splice(50); S.gold+=extra.reduce((a,g)=>a+sellVal(g),0); }
function unequip(slot){ const g=S.gear[slot]; if(!g) return; delete S.gear[slot]; S.bags.push(g); if(B){ const m=B.party.find(u=>u.me); if(m) m.gp=gearPow(); } }
function equip(g){
  if(g.kind==='recipe' || g.cls!==S.cls) return;
  S.bags = S.bags.filter(x=>x.id!==g.id);
  if(S.gear[g.slot]) S.bags.push(S.gear[g.slot]);
  S.gear[g.slot] = g; trimBags();
  if(B){ const m=B.party.find(u=>u.me); if(m){ m.gp=gearPow(); } }
}

// ================= Quests =================
const qState = q => S.q[q.id];
function qAvailable(q){ return !S.q[q.id] && S.level>=q.lvl && avgIL()>=q.il; }
const activeQuests = () => ALLQ.filter(q=>S.q[q.id]?.st==='active');
const qDone = q => S.q[q.id]?.st==='active' && S.q[q.id].p>=q.need;
function acceptQ(id){ const q=QBY[id]; if(!q || !qAvailable(q) || activeQuests().length>=5) return; S.q[id]={st:'active', p:0}; log(`Quest accepted: ${q.t}`, '#ffd23f'); }
function abandonQ(id){ if(S.q[id]?.st==='active'){ delete S.q[id]; } }
function turnIn(id){
  const q=QBY[id]; if(!q || !qDone(q)) return;
  S.q[id] = {st:'done'};
  const xp = Math.round(xpNext(q.lvl)*q.xpF), g = Math.round(mobGold(q.lvl)*40*goldM());
  S.gold += g; log(`Quest complete: ${q.t}. +${fmt(xp)} XP, +${fmt(g)} gold`, '#ffd23f');
  const cards=[{icon:XP_ICON(), label:`+${fmt(xp)} XP`, col:'#b48cff'}, {icon:GOLD_ICON(), label:`+${fmt(g)} gold`, col:'#f3c95a'}];
  grantXP(xp);
  const gear=makeGear(q.lvl, q.rr, S.cls); receive(gear, true); cards.push(cardItem(gear));
  if(q.i%2===1){ const rc=makeRecipe(q.z, 2); receive(rc, true); cards.push(cardItem(rc)); }
  addRep(q.z, 250); dProgress('quest'); cards.push({icon:REP_ICON(), label:'+250 reputation', sub:FACTIONS[q.z], col:'#5fd47a'});
  reveal('Quest Complete', q.t, cards);
}
function qProgress(type, test, amt=1){
  for(const q of activeQuests()){
    if(q.type!==type || !test(q)) continue;
    const st=S.q[q.id]; if(st.p>=q.need) continue;
    st.p = Math.min(q.need, st.p+amt);
    if(st.p>=q.need){ log(`Objective complete: ${q.t}. Turn it in on the Quests tab.`, '#ffd23f'); toast(`Quest ready: ${q.t}`, '#ffd23f'); }
  }
}

// ================= Battle =================
function newBattle(mode){
  B = {mode, party:[], en:[], fx:[], nums:[], spawnT:0.5, spawned:0, eid:0, d:null, cheatCD:0, over:false, cd:{}, mech:null, fix:null, tauntT:0, say:null, sayCD:0, banner:null, curseAI:99};
}
function placeUnit(u, i){ u.x = 200 - i*45; u.hp = unitHP(u); u.t=0; u.idx=0; u.dead=0; u.anim=0; u.shield=0; u.hot=0; u.hotAmt=0; u.cheatUsed=false; u.lane=i; u.threat=0; return u; }
function resetThreat(){ for(const u of B.party) u.threat = u.role==='Tank' ? 1 : 0; }
function startWorld(){ newBattle('world'); B.party=[placeUnit(meUnit(),0)]; }
function foeEl(z){ const Z=ZONES[z]; if(Z.el==='mixed') return pick(EL); return Math.random()<0.8 ? Z.el : pick(EL.filter(e=>e!==Z.el)); }
const KIND = {norm:{hp:1,atk:1,r:16,xp:1,g:1,int:1.25}, elite:{hp:4,atk:1.6,r:22,xp:3,g:4,int:1.3}, champ:{hp:12,atk:2,r:32,xp:10,g:15,int:1.5},
  dtrash:{hp:3.2,atk:1.4,r:19,xp:1.5,g:2,int:1.3}, dboss:{hp:30,atk:2.0,r:36,xp:0,g:30,int:1.7}, dmini:{hp:9,atk:1.7,r:27,xp:5,g:8,int:1.5}};
function spawnEnemy(kind, name, foe, L, z){
  if(kind==='dboss'||kind==='champ'){ sfx('boss'); addShake(2.5); }
  const K=KIND[kind], hp=mobHP(L)*K.hp;
  const e={id:++B.eid, kind, name, foe, L, el:foeEl(z), x:WORLD+30+Math.random()*60, vx:0, hp, max:hp, atk:mobAtk(L)*K.atk, int:K.int,
    t:Math.random()*0.5, stun:0, slow:0, burn:0, burnD:0, hex:0, flash:0, dying:0, lunge:0, r:K.r, spd: kind==='dboss'||kind==='champ'?60:90+Math.random()*30, bob:Math.random()*6};
  B.en.push(e); return e;
}
function worldSpawn(){
  const Z=ZONES[S.zone], L=mobLevel()+ (Math.random()<0.3?1:0) - (Math.random()<0.2?1:0);
  B.spawned++;
  const eliteQ = activeQuests().some(q=>q.type==='elite' && q.z===S.zone && !qDone(q));
  if(eliteQ && B.spawned%7===0){ spawnEnemy('elite', Z.elite, -1, clamp(L+1,1,62), S.zone); log(`${Z.elite} emerges!`, '#ffae4a'); return; }
  const fi = Math.floor(Math.random()*4);
  spawnEnemy('norm', Z.foes[fi][0], fi, clamp(L,1,62), S.zone);
}
const alive = () => B.en.filter(e=>e.hp>0);
const partyAlive = () => B.party.filter(u=>u.dead<=0);
const needHeal = (th=0.7) => partyAlive().some(u=>u.hp<unitHP(u)*th);

function update(dt){
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('#toast').hidden=true; }
  if(!S.created || !B) return;
  B.cheatCD = Math.max(0, B.cheatCD-dt);
  let al = alive();
  const D = B.d;
  // spawning
  if(B.mode==='world'){
    const norm = al.filter(e=>e.kind==='norm').length;
    B.spawnT -= dt;
    if(norm < 2 && B.spawnT<=0){ worldSpawn(); B.spawnT = 1.4; }
    if(B.node){ B.node.life-=dt; if(B.node.life<=0) B.node=null; } else { B.nodeT=(B.nodeT??25)-dt; if(B.nodeT<=0){ B.node={x:260+Math.random()*420, kind:pick(Object.keys(NODE_KIND)), life:25}; B.nodeT=40+Math.random()*40; } }
  } else if(D && !B.over && D.raid){
    if(!al.length){
      D.wait -= dt;
      if(D.wait<=0){
        if(D.pack < dPulls(D)){ const n=5; for(let i=0;i<n;i++){ const e=spawnEnemy('dtrash', pick(RAID.trash), -1, D.lvl, D.z); e.x += i*42; e.hp*=RAIDT.trashHP; e.max=e.hp; e.atk*=RAIDT.trashAtk; } D.pack++; log(`Pull ${D.pack} of ${dPulls(D)} engages!`, '#ffae4a'); }
        else if(!D.bossUp){ const e=spawnEnemy('dboss', dBoss(D), -1, D.lvl, D.z); e.hp*=RAIDT.bossHP; e.max=e.hp; e.atk*=RAIDT.bossAtk; e.r=40; D.bossUp=true; D.bossT=150; log(`BOSS: ${dBoss(D)} awakens!`, '#ff8c0d'); say('boss', null, true); }
      }
    } else if(D.bossUp){ D.bossT -= dt; if(D.bossT<=0 && !D.enraged){ D.enraged=true; for(const e of al) if(e.kind==='dboss') e.atk*=3; log(`${dBoss(D)} becomes enraged!`, '#ff6b6b'); }
      const bs=al.find(e=>e.kind==='dboss'); if(bs && !B.mech){ D.aoeT=(D.aoeT??RAIDT.aoeEvery)-dt; if(D.aoeT<=1.6){ D.aoeT=RAIDT.aoeEvery+1.6; startMech(bs, 'zone', 'Crown Shockwave', {dmg:RAIDT.aoe, max:1.6, dodgeM:0.35}); } }
      if(D.raid && !D.adds){ if(bs && bs.hp<bs.max*0.5){ D.adds=true; for(let i=0;i<3;i++){ const e=spawnEnemy('dtrash', RAID.trash[2], -1, D.lvl, D.z); e.x=WORLD+20+i*40; e.hp*=1.2; e.max=e.hp; } log('The Hollow Crown summons echoes of fallen kings!', '#c78cff'); fanfare('PHASE 2', 'Echoes rise to defend the Crown', '#c78cff'); addShake(3); say('phase', null, true); } } }
    mechTick(dt); if(B.over) return;
  } else if(D && !B.over){
    D.time += dt;
    if(D.state==='walk'){ D.walk-=dt; D.scroll=(D.scroll||0)+dt*W*0.42; if(D.walk<=0) enterRoom(); }
    else if(D.state==='room' && !al.length && !D.choice && D.rooms[D.ri]!=='boss') nextRoom();
    if(D.bossUp && al.some(e=>e.kind==='dboss')){ D.bossT -= dt; if(D.bossT<=0 && !D.enraged){ D.enraged=true; for(const e of al) if(e.kind==='dboss') e.atk*=3; log(`${dBoss(D)} becomes enraged!`, '#ff6b6b'); banner('ENRAGED!', '#ff6b6b'); } }
    mechTick(dt); if(B.over) return;
  }
  if(B.banner){ B.banner.life-=dt; if(B.banner.life<=0) B.banner=null; }
  if(B.say){ B.say.life-=dt; if(B.say.life<=0) B.say=null; }
  B.sayCD=Math.max(0,(B.sayCD||0)-dt); B.tauntT=Math.max(0,(B.tauntT||0)-dt);
  for(const k in B.cd) B.cd[k]=Math.max(0,B.cd[k]-dt);
  autoSkills();
  al = alive();
  if(!al.length) resetThreat();
  // party upkeep
  for(const u of B.party){
    const mh=unitHP(u); u.anim=Math.max(0,u.anim-dt); u.shield=Math.max(0,u.shield-dt); u.wall=Math.max(0,(u.wall||0)-dt); u.haste=Math.max(0,(u.haste||0)-dt); u.hop=Math.max(0,(u.hop||0)-dt);
    if(u.dead>0){ if(B.mode==='world'){ u.dead-=dt; if(u.dead<=0){ u.hp=mh; log(`${u.name} returns to the fight.`, '#7ee08f'); } } continue; }
    if(u.hot>0){ u.hot-=dt; u.hp=Math.min(mh, u.hp + u.hotAmt*dt); }
    if(u.curse>0){ u.curse-=dt; u.hp-=mh*0.045*dt; if(u.hp<=0){ u.hp=0.01; u.curse=0; hurt(u, 1e12); if(B.over) return; continue; } }
    if(B.d && !u.me && al.length && u.hp<mh*0.3 && (u.lowCD||0)<time){ u.lowCD=time+12; say('low', u); }
    u.hp = Math.min(mh, u.hp + mh*(al.length?0.01:0.1)*dt);
  }
  // movement
  const front = al.length ? al.reduce((a,e)=>e.x<a.x?e:a) : null;
  const order = {melee:[], mid:[], ranged:[]};
  for(const u of partyAlive()) order[CLASSES[u.cls].reach].push(u);
  const meleeX = order.melee.length ? Math.max(...order.melee.map(u=>u.x)) : null;
  const HOLD = 440;
  order.melee.forEach((u,i)=>{ const want = (front ? Math.min(HOLD, front.x-front.r-18) : 260) - i*26; u.x += clamp(want-u.x, -170*dt, 170*dt); });
  order.mid.forEach((u,i)=>{ const lim = meleeX!==null ? meleeX-55 : HOLD-40; const want = front ? clamp(front.x-190-i*26, 60, lim) : Math.min(190-i*24, lim); u.x += clamp(want-u.x, -140*dt, 140*dt); });
  order.ranged.forEach((u,i)=>{ const lim = meleeX!==null ? meleeX-70 : HOLD-60; const want = front ? clamp(front.x-330-i*30, 50, lim) : Math.min(150-i*28, lim); u.x += clamp(want-u.x, -125*dt, 125*dt); });
  // casting
  for(const u of partyAlive()){
    let id = u.skills[u.idx % u.skills.length], sk = SKILLS[id], tries=0;
    while(tries<3 && !castable(sk, front, u)){ u.idx++; id=u.skills[u.idx % u.skills.length]; sk=SKILLS[id]; tries++; }
    if(!castable(sk, front, u)) continue;
    u.t = Math.min(sk.time, u.t + dt*unitSpeed(u));
    let ready = true;
    if(sk.mult && !sk.healAll){ const gap = front.x - front.r - u.x; const reach=CLASSES[u.cls].reach; ready = reach==='melee' ? gap <= (sk.dash?260:48) : reach==='mid' ? gap <= 230 : gap <= 400; }
    else if(sk.healAll){ const gap = front.x - front.r - u.x; ready = gap <= 400; }
    if(ready && u.t>=sk.time){ u.t=0; u.idx++; cast(u, id, front); al=alive(); }
  }
  // enemies
  for(const e of B.en){
    if(e.hp<=0){ e.dying+=dt; continue; }
    e.flash=Math.max(0,e.flash-dt); e.hex=Math.max(0,e.hex-dt); e.slow=Math.max(0,e.slow-dt); e.lunge=Math.max(0,e.lunge-dt);
    if(e.burn>0){ e.burn-=dt; e.hp-=e.burnD*dt; if(e.hp<=0){ kill(e); continue; } }
    e.x += e.vx*dt; e.vx *= Math.pow(0.02, dt);
    if(e.stun>0){ e.stun-=dt; e.mv=0; continue; }
    const pa = partyAlive(); if(!pa.length) continue;
    const frontU = pa.reduce((a,u)=>u.x>a.x?u:a);
    let tgt = pa.reduce((a,u)=>(u.threat||0)>(a.threat||0)?u:a, frontU);
    if(B.tauntT>0){ const me=pa.find(u=>u.me); if(me) tgt=me; }
    if(B.fix && B.fix.src===e && B.fix.u.dead<=0) tgt=B.fix.u;
    if(e.casting){ e.mv=0; continue; }
    const gap = e.x - e.r - tgt.x - 14, sf = e.slow>0?0.55:1;
    if(gap>6){ e.mv=1; e.x -= e.spd*sf*dt; e.t=Math.min(e.t, 0.6); }
    else { e.mv=0; e.t += dt*sf; if(e.t>=e.int){ e.t=0; e.lunge=0.15; hurt(tgt, e.atk); if(e.kind==='dboss'||e.kind==='champ') addShake(2.2); if(B.over) return; } }
  }
  const q = alive().sort((a,b)=>a.x-b.x);
  for(let i=1;i<q.length;i++){ const minX=q[i-1].x+(q[i-1].r+q[i].r)*0.85; if(q[i].x<minX) q[i].x=minX; }
  B.en = B.en.filter(e=>!(e.hp<=0 && e.dying>0.5));
  for(const f of B.fx) f.life-=dt; B.fx=B.fx.filter(f=>f.life>0);
  for(const n of B.nums) n.life-=dt; B.nums=B.nums.filter(n=>n.life>0);
}
function castable(sk, front, u){
  const healer = u && u.role==='Healer';
  if(sk.heal || sk.hot) return needHeal(healer ? (sk.hot?0.95:0.85) : (sk.hot?0.85:0.7));
  if(sk.shield) return !!front && needHeal(healer?0.95:0.9);
  return !!front;
}
function cast(u, id, target){
  const sk=SKILLS[id], el=u.el, a=unitAtk(u)*unitRankM(u,id);
  u.anim=0.3;
  const al=alive();
  if(sk.heal || sk.hot || sk.shield){
    const hm = RM(u).heal;
    for(const p of partyAlive()){
      const mh=unitHP(p);
      if(sk.heal){ const amt=mh*sk.heal*hm; p.hp=Math.min(mh,p.hp+amt); u.threat=(u.threat||0)+amt*0.3; num(p.x,'+'+fmt(amt),'#7dff9a',false,'ally'); }
      if(sk.hot){ p.hot=6; p.hotAmt=mh*sk.hot*hm/6; }
      if(sk.shield) p.shield=sk.shield;
      B.fx.push({t:'heal', x:p.x, col: sk.shield?'#f3e08a':'#7dff9a', life:0.7, max:0.7});
    }
    return;
  }
  if(!target) return;
  if(sk.dash){ B.fx.push({t:'dash', x1:u.x, x2:target.x-target.r-30, life:0.2, max:0.2}); u.x=Math.max(u.x, target.x-target.r-30); }
  let tg;
  if(sk.all) tg=al;
  else if(sk.aoe){ const cx = CLASSES[u.cls].reach==='melee' ? u.x+50 : target.x; tg=al.filter(e=>Math.abs(e.x-cx)<=sk.aoe+e.r); B.fx.push({t:'ring', x:cx, r:sk.aoe, col: el?ELEM[el].c:'#fff', life:0.35, max:0.35}); }
  else if(sk.chain) tg=[...al].sort((p,q)=>Math.abs(p.x-target.x)-Math.abs(q.x-target.x)).slice(0,sk.chain);
  else tg=[target];
  if(sk.healAll){ for(const p of partyAlive()){ const amt=unitHP(p)*sk.healAll*RM(u).heal; p.hp=Math.min(unitHP(p),p.hp+amt); } B.fx.push({t:'flash', col:'#fff4c0', life:0.25, max:0.25}); }
  if(id==='nova') B.fx.push({t:'flash', col:ELEM[el].c, life:0.25, max:0.25});
  const reach=CLASSES[u.cls].reach;
  let prev=null;
  for(const e of tg){
    if(reach!=='melee') B.fx.push({t: CLASSES[u.cls].w==='bow'?'arrow':'beam', from: sk.chain&&prev?prev.x:u.x, fromHero:!(sk.chain&&prev), x2:e.x, col:ELEM[el].c, life:0.2, max:0.2});
    prev=e;
    for(let i=0;i<(sk.hits||1);i++){ let m=sk.mult; if(sk.execute && e.hp/e.max<0.3) m*=3; hit(e, a*m, el, u); }
    if(e.hp>0){
      const boss = e.kind==='dboss'||e.kind==='champ';
      if(sk.stun) e.stun = sk.stun*(boss?0.2:0.8);
      if(sk.kb && !boss){ e.vx += sk.kb*2; B.fx.push({t:'dust', x:e.x, life:0.4, max:0.4}); }
      if(sk.hex) e.hex = sk.hex;
    }
  }
  if(u.role==='Tank' && B.party.length>1){ const top=Math.max(0, ...B.party.filter(p=>p!==u).map(p=>p.threat||0)); u.threat=Math.max(u.threat||0, top*1.15+1); }
  if(reach==='melee' || reach==='mid' && CLASSES[u.cls].w==='mace' && !sk.all) B.fx.push({t:'slash', x:u.x+26, big:!!sk.aoe, life:0.22, max:0.22});
}
function hit(e, amt, el, src, noProc){
  if(e.hp<=0) return;
  let m=1, weak=false;
  if(el){ if(WEAK[e.el]===el){ m=1.6 + (src?RB(src.race,'weak'):0) + (src&&src.me?0.08*rank('attune'):0); weak=true; } else if(e.el===el) m=0.6; }
  if(e.hex>0) m*=1.3;
  if(src && B.d){ if(B.d.buff==='might') m*=1.2; if(B.d.draught) m*=1.15; }
  const crit = Math.random() < (src?unitCrit(src):0.05); if(crit) m*=2;
  let d=amt*m;
  if(e.absorb>0){ const ab=Math.min(e.absorb,d); e.absorb-=ab; d-=ab; if(e.absorb<=0.5) shieldBroken(e); if(d<=0){ e.flash=0.08; if(src&&src.me) num(e.x+rnd(-10,10),'ABSORB','#f3e08a',false,'foe'); return; } }
  e.hp-=d; e.flash=0.12;
  if(src && src.me){ if(crit){ sfx('crit'); addShake(1.6); } else sfx('hit'); }
  if(src && src.threat!==undefined) src.threat += d*RM(src).threat;
  if(src && CLASSES[src.cls].reach==='melee' && e.kind==='norm') e.vx+=40;
  if(el && !noProc){
    if(el==='fire'){ e.burn=3; e.burnD=Math.max(e.burnD*0.5, d*0.08); }
    else if(el==='frost') e.slow=2;
    else if(el==='storm' && Math.random()<0.35){ const o=B.en.find(x=>x!==e&&x.hp>0); if(o){ B.fx.push({t:'beam', from:e.x, fromHero:false, x2:o.x, col:ELEM.storm.c, life:0.18, max:0.18}); hit(o, d*0.4, el, src, true); } }
  }
  if(!src || src.me || crit || weak) num(e.x+rnd(-14,14), fmt(d)+(weak?'!':''), crit?'#ffe066':el?ELEM[el].c:'#ffffff', crit||weak, 'foe');
  if(e.hp<=0) kill(e);
}
function hurt(u, dmg){
  const d = dmg * (1-unitDR(u)) * (u.shield>0?0.6:1) * (u.wall>0?1-u.wallP:1) * (B.d&&B.d.buff==='vigor'?0.85:1);
  u.hp -= d; num(u.x, '-'+fmt(d), '#ff6b6b', false, 'ally');
  if(u.hp>0) return;
  if(RB(u.race,'cheat') && (B.mode==='world' ? B.cheatCD<=0 : !u.cheatUsed)){ u.hp=unitHP(u)*0.3; u.cheatUsed=true; if(u.me) B.cheatCD=90; log(`${u.name} cheats death!`, '#a9e8ff'); return; }

    <div class="loot" style="--rc:${RAR[g.r].c}">${slotIcon(g)}<div style="min-width:0"><div class="nm" style="color:${RAR[g.r].c}">${esc(g.name)}</div><div class="meta">${isRec?`${RAR[g.r].n} ${PROFS[g.pid].n} recipe \u00b7 requires skill ${RECIPES[g.rid].req}`:`${RAR[g.r].n} ${g.slot} \u00b7 ${CLASSES[g.cls].n} \u00b7 Item level ${g.ilvl}${g.st?' \u00b7 '+statText(g.st):''}`}</div><div class="df">${cmp}</div></div></div>${res}${btns}`);
}
function doRoll(choice){
  const R=UI.roll; if(!R || R.result) return;
  const g=R.items[R.i];
  if(choice==='need' && (g.kind==='recipe' ? !canLearn(g) : g.cls!==S.cls)) choice='greed';
  const entries = [{name:S.name, me:true, type:choice}];
  for(const u of B.party) if(!u.me){
    let t = 'pass';
    if(g.kind==='recipe') t = Math.random()<0.5 ? 'greed' : 'pass';
    else if(u.cls===g.cls) t = Math.random()<0.9 ? 'need' : 'greed';
    else t = Math.random()<0.7 ? 'greed' : 'pass';
    entries.push({name:u.name, me:false, type:t});
  }
  for(const e of entries) e.roll = e.type==='pass' ? 0 : 1+Math.floor(Math.random()*100);
  const pool = entries.some(e=>e.type==='need') ? entries.filter(e=>e.type==='need') : entries.filter(e=>e.type==='greed');
  let winner = null;
  if(pool.length) winner = pool.reduce((a,b)=>b.roll>a.roll?b:a);
  if(winner) winner.win = true;
  R.result = entries;
  if(winner?.me){ receive(g, true); sfx('loot', g.r); if(g.r>=3) fanfare(g.r===4?'LEGENDARY!':'EPIC LOOT!', g.name, RAR[g.r].c); log(`You won [${g.name}] (${winner.type==='need'?'Need':'Greed'} ${winner.roll}).`, RAR[g.r].c); }
  else if(winner) log(`${winner.name} won [${g.name}] (${winner.type==='need'?'Need':'Greed'} ${winner.roll}).`, '#a3937f');
  else log(`Everyone passed on [${g.name}].`, '#a3937f');
  renderRoll();
}

const AUD={ctx:null,mus:null,sfx:null,next:0,step:0,lastHit:0};
const MIDI=n=>440*2**((n-69)/12);
const SCORES=[{root:60,sc:[0,2,4,5,7,9,11],bpm:104,prog:[0,5,3,4]},{root:62,sc:[0,1,4,5,7,8,10],bpm:96,prog:[0,1,0,6]},{root:57,sc:[0,2,3,5,7,8,10],bpm:84,prog:[0,5,2,6]},
  {root:62,sc:[0,2,3,5,7,9,10],bpm:92,prog:[0,3,0,4]},{root:52,sc:[0,2,3,5,7,8,11],bpm:118,prog:[0,5,6,4]},{root:59,sc:[0,1,3,5,6,8,10],bpm:78,prog:[0,1,5,4]}];
function audioInit(){ if(AUD.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ AUD.ctx=new AC(); AUD.mus=AUD.ctx.createGain(); AUD.sfx=AUD.ctx.createGain(); AUD.mus.connect(AUD.ctx.destination); AUD.sfx.connect(AUD.ctx.destination); applyVol(); AUD.next=AUD.ctx.currentTime+0.1; setInterval(musicTick,100); }catch(e){ AUD.ctx=null; } }
function applyVol(){ if(!AUD.ctx) return; AUD.mus.gain.value = S.audio?.m===0 ? 0 : 0.055; AUD.sfx.gain.value = S.audio?.s===0 ? 0 : 0.16; }
function tone(dest,type,f,t0,d,g=1,slide){ const c=AUD.ctx, o=c.createOscillator(), a=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d); a.gain.setValueAtTime(0.0001,t0); a.gain.exponentialRampToValueAtTime(g,t0+0.01); a.gain.exponentialRampToValueAtTime(0.0001,t0+d); o.connect(a); a.connect(dest); o.start(t0); o.stop(t0+d+0.03); }
let NOISEBUF=null;
function noise(dest,t0,d,g){ const c=AUD.ctx; if(!NOISEBUF){ const len=c.sampleRate; NOISEBUF=c.createBuffer(1,len,c.sampleRate); const ch=NOISEBUF.getChannelData(0); for(let i=0;i<len;i++) ch[i]=Math.random()*2-1; }
  const src=c.createBufferSource(), a=c.createGain(); src.buffer=NOISEBUF; a.gain.setValueAtTime(g,t0); a.gain.exponentialRampToValueAtTime(0.0001,t0+d); src.connect(a); a.connect(dest); src.start(t0); src.stop(t0+d+0.02); }
function musicTick(){
  const c=AUD.ctx; if(!c) return; if(c.state!=='running' || S.audio?.m===0 || document.hidden || !S.created){ AUD.next=c.currentTime+0.1; return; }
  const z=B?.d?B.d.z:S.zone, sc=SCORES[z]||SCORES[0], dun=!!B?.d, step=60/(sc.bpm*(dun?0.9:1)*(B?.d?.bossUp?1+0.07*((B.d.phase||1)):1))/4;
  if(AUD.next<c.currentTime) AUD.next=c.currentTime+0.05;
  while(AUD.next < c.currentTime+0.3){
    const st=AUD.step%64, deg=sc.prog[Math.floor(st/16)], t=AUD.next, note=i=>sc.root+sc.sc[(deg+i)%7]+12*Math.floor((deg+i)/7);
    if(st%4===0) tone(AUD.mus,'triangle',MIDI(note(0)-12),t,step*3.6,0.9);
    if(st%2===0) tone(AUD.mus,'square',MIDI(note([0,2,4,7][(st/2)%4])+(dun?0:12)),t,step*1.6,0.32);
    if(st%16===6||st%16===14) tone(AUD.mus,'square',MIDI(note(4)+24),t,step*2.2,0.16);
    if(st%8===4) noise(AUD.mus,t,0.05,0.22);
    AUD.next+=step; AUD.step++;
  }
}
function sfx(k,p=0){
  const c=AUD.ctx; if(!c || c.state!=='running' || S.audio?.s===0) return; const t=c.currentTime, d=AUD.sfx;
  try{ switch(k){
    case 'hit': if(t-AUD.lastHit<0.07) return; AUD.lastHit=t; noise(d,t,0.05,0.3); tone(d,'square',220,t,0.05,0.22,110); break;
    case 'crit': noise(d,t,0.09,0.45); tone(d,'square',660,t,0.12,0.32,180); break;
    case 'pop': tone(d,'triangle',300,t,0.12,0.45,90); break;
    case 'loot': [0,4,7,12].slice(0,2+Math.min(2,p)).forEach((n,i)=>tone(d,'square',MIDI(72+n+p*2),t+i*0.06,0.12,0.28)); break;
    case 'coin': tone(d,'square',MIDI(84),t,0.06,0.22); tone(d,'square',MIDI(91),t+0.06,0.12,0.22); break;
    case 'level': [0,4,7,12,16,19,24].forEach((n,i)=>tone(d,'square',MIDI(67+n),t+i*0.07,0.22,0.28)); tone(d,'triangle',MIDI(55),t,0.8,0.5); break;
    case 'quest': [0,7,12].forEach((n,i)=>tone(d,'square',MIDI(72+n),t+i*0.1,0.2,0.28)); break;
    case 'craft': noise(d,t,0.06,0.35); tone(d,'triangle',MIDI(88),t,0.25,0.3); break;
    case 'boss': tone(d,'sawtooth',110,t,0.7,0.3,55); noise(d,t,0.4,0.22); break;
    case 'flip': tone(d,'square',MIDI(76+p*3),t,0.08,0.22); break;
    case 'fail': tone(d,'square',220,t,0.25,0.28,110); break;
  } }catch(e){}
}

const FACTIONS=['Wardens of the Vale','Sandstrider Clans','Frostfang Watch','Tidecaller Conclave','Emberforge Thanes','Order of the Hollow Light'];
const STANDINGS=[['Neutral',0,'#a3937f'],['Friendly',1000,'#5fd47a'],['Honored',3000,'#4a94ff'],['Revered',6000,'#b25cff'],['Exalted',12000,'#ff8c0d']];
const repOf = z => S.rep[z]||0;
const standing = z => { let i=0; STANDINGS.forEach(([,v],j)=>{ if(repOf(z)>=v) i=j; }); return i; };
function addRep(z, amt){
  if(z===undefined || z<0 || z>=FACTIONS.length) return;
  const before=standing(z); S.rep[z]=Math.min(12000, repOf(z)+Math.round(amt)); const after=standing(z);
  if(after>before){ log(`${FACTIONS[z]}: you are now ${STANDINGS[after][0]}!`, STANDINGS[after][2]); toast(`${STANDINGS[after][0]} with ${FACTIONS[z]}`, STANDINGS[after][2]); }
}
function gearForSlot(lvl, r, slot){ for(let i=0;i<60;i++){ const g=makeGear(lvl, r, S.cls); if(g.slot===slot) return g; } const g=makeGear(lvl,r,S.cls); g.slot=slot; return g; }
function vendorItems(z){
  const lvl=dLevel(z,false), crafts=Object.keys(S.profs).filter(p=>CRAFT[p]), items=[];
  const pickIt=(pid,salt)=>{ const P=CRAFT[pid]; return P.elixirs ? ELIX[(z+salt)%3][0] : P.slots[(z+salt)%P.slots.length]; };
  for(const pid of crafts) items.push({id:'r2-'+pid, need:1, kind:'recipe', rid:`${pid}-${z}-${pickIt(pid,0)}-2`, price:Math.round(mobGold(lvl)*120)});
  const rk = crafts.length ? RARE_FOR[crafts[0]] : 'gem';
  items.push({id:'reag', need:1, kind:'mat', n:RARE[rk][z], q:3, price:Math.round(matValue(RARE[rk][z])*3*1.5)});
  items.push({id:'g2', need:2, kind:'gear', slot:SLOTS[(z+1)%5], r:2, lvl, price:Math.round(mobGold(lvl)*200)});
  items.push({id:'troph', need:2, kind:'mat', n:TROPHY[z], q:2, price:Math.round(matValue(TROPHY[z])*2*1.6)});
  for(const pid of crafts) items.push({id:'r3-'+pid, need:3, kind:'recipe', rid:`${pid}-${z}-${pickIt(pid,1)}-3`, price:Math.round(mobGold(lvl)*400)});
  items.push({id:'pet', need:3, kind:'pet', pet:ZPET[z], price:Math.round(mobGold(lvl)*600)});
  items.push({id:'g3', need:4, kind:'gear', slot:'weapon', r:3, lvl, price:Math.round(mobGold(lvl)*900)});
  return items.filter(it=>it.kind!=='recipe' || RECIPES[it.rid]);
}
function vendorBuy(z, id){
  const it=vendorItems(z).find(v=>v.id===id); if(!it || standing(z)<it.need) return;
  if(it.kind==='recipe' && S.known[it.rid]) return;
  if(it.kind==='pet' && S.pets.includes(it.pet)) return;
  if(S.gold<it.price){ toast('Not enough gold','#ff6b6b'); return; }
  S.gold-=it.price;
  if(it.kind==='recipe'){ const rec=RECIPES[it.rid]; S.known[it.rid]=true; log(`You learned ${craftName(rec)} from the ${FACTIONS[z]} quartermaster.`, RAR[rec.r].c); toast(`Recipe learned: ${craftName(rec)}`, RAR[rec.r].c); }
  else if(it.kind==='pet'){ rollPet(1, FACTIONS[z], it.pet); }
  else if(it.kind==='mat'){ addMat(it.n, it.q); log(`Bought ${it.n} ×${it.q}.`, '#f3c95a'); }
  else { const g=gearForSlot(it.lvl, it.r, it.slot); g.name=g.name.replace(/^\S+/, FACTIONS[z].split(' ').pop()+'’s'); receive(g); }

function ensureDaily(){
  if(!S.created) return;
  const day=dayKey(); if(S.daily && S.daily.day===day) return;
  const prevDay=S.daily?.day, yest=(()=>{ const d=new Date(); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; })();
  const streak = S.daily && prevDay===yest && S.daily.chest ? (S.daily.streak||0) : 0;
  const r=srand(hashStr(day+S.name)), pool=Object.entries(DAILY_TYPES).filter(([,d])=>!d.ok||d.ok()).map(([k])=>k);
  const picks=[]; while(picks.length<3 && pool.length){ const i=Math.floor(r()*pool.length); picks.push(pool.splice(i,1)[0]); }
  S.daily={day, streak, chest:false, tasks:picks.map(k=>({k, need:DAILY_TYPES[k].n(), p:0, claimed:false}))};
}
function dProgress(k, amt=1){ if(!S.daily) return; for(const t of S.daily.tasks){ if(t.k===k && t.p<t.need){ t.p=Math.min(t.need,t.p+amt); if(t.p>=t.need) toast(`Daily done: ${DAILY_TYPES[k].t(t.need)}`, '#ffd23f'); } } }

function claimDaily(i){
  const t=S.daily?.tasks[i]; if(!t || t.claimed || t.p<t.need) return;
  t.claimed=true; const g=dailyGold(), xp=Math.round(xpNext(S.level)*0.06*xpM());
  S.gold+=g; grantXP(xp); addRep(S.zone,150); S.st.dailies=(S.st.dailies||0)+1; sfx('coin');
  log(`Daily complete: +${fmt(g)} gold, +${fmt(xp)} XP, +150 ${FACTIONS[S.zone]} rep.`, '#ffd23f');
}
function claimChest(){
  const D=S.daily; if(!D || D.chest || !D.tasks.every(t=>t.claimed)) return;
  D.chest=true; D.streak=(D.streak||0)+1;
  const r = Math.random()<0.25?3:2, g=makeGear(Math.max(1,S.level), r, S.cls), ess=1+(Math.random()<0.5?1:0);

function ensureBoard(force){

  if(!force && S.mboard && now-S.mboard.at<4*3600000 && S.mboard.list.length) return;
  const zs=ZONES.map((_,i)=>i).filter(i=>ZONES[i].min<=S.level), list=[];
  for(let i=0;i<4;i++){ const z=pick(zs), ml=clamp(ZONES[z].min+Math.floor(Math.random()*10), 1, Math.min(60,S.level+2)), type=pick(Object.keys(MTYPES));

    if(m.type==='hunt' && m.lvl>=dUnlock(m.z,false) && Math.random()<0.2*h){ addMat(TROPHY[m.z]); got.push(TROPHY[m.z]); cards.push({icon:matIcon(TROPHY[m.z],1), label:TROPHY[m.z], sub:'Dungeon trophy', col:RAR[3].c, r:3}); }

      if(Math.random()<0.1*h){ const rc=makeRecipe(m.z,2); S.bags.push(rc); got.push(rc.name); cards.push(cardItem(rc)); } }
    const rp=Math.round(60*h*(m.type==='rescue'?2.5:m.type==='hunt'?1.5:1)); addRep(m.z, rp); cards.push({icon:REP_ICON(), label:`+${rp} reputation`, sub:FACTIONS[m.z], col:'#5fd47a'});

  if(!ok) sfx('fail');

  if(!S.mboard.list.length) ensureBoard(true);
}

const weekKey = () => { const d=new Date(); const day=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
const raidLocked = () => !!(S.raid && S.raid.week===weekKey() && S.raid.cleared);
const raidReset = () => { const d=new Date(), day=(d.getDay()+6)%7, n=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day+7); return (n-d)/1000; };
const raidLevel = () => clamp(S.level+2, 32, 62);
const RAID_MERC={warrior:[['Sergeant Brann','dwarf'],['Knight Odile','human']], cleric:[['Sister Amaya','human'],['Brother Tomas','dwarf']], mage:[['Magus Telra','elf'],['Arcanist Venn','revenant'],['Pyra Quell','drakari']], ranger:[['Scout Ilsa','human'],['Hunter Rook','orc'],['Warden Faye','elf']]};
function raidGroup(){
  const need={Tank:2, Healer:2, DPS:6}; need[S.role]--; const out=[], used=new Set(), mused={};
  const mercFor = role => { const classes = role==='Tank'?['warrior']:role==='Healer'?['cleric']:['mage','ranger','mage','ranger','warrior','mage'];
    for(const cls of classes){ const list=RAID_MERC[cls]; mused[cls]=mused[cls]||0; if(mused[cls]<list.length){ const [name,race]=list[mused[cls]++]; return {src:'merc', cls, name, race, role}; } } return {src:'merc', cls:'mage', name:'Sellsword', race:'human', role}; };
  for(const role of ['Tank','Healer','DPS']){ while(need[role]>0){
    const cand=NET.roster.filter(h=>h.role===role && !used.has(h.id) && h.level>=RAID.min-5).sort((a,b)=>(NET.online.has(b.id)-NET.online.has(a.id)) || b.level-a.level)[0];
    if(cand){ used.add(cand.id); out.push({src:'player', h:cand}); } else out.push(mercFor(role)); need[role]--; } }
  return out;
}

function matValue(n){
  for(let t=0;t<FISH.length;t++){ if(FISH[t][0]===n) return Math.round(3*1.6**t); if(FISH[t][1]===n) return Math.round(20*1.6**t); }
  for(const g of Object.values(GATHER)){ const t=g.mats.indexOf(n); if(t>=0) return Math.round(2*1.6**t); }
  let t=CLOTH.indexOf(n); if(t>=0) return Math.round(2*1.6**t);
  for(const arr of Object.values(RARE)){ t=arr.indexOf(n); if(t>=0) return Math.round(15*1.6**t); }

async function buyListing(id){

async function settle(L, why){

    const snap=await ref.get(); if(!snap.exists) return false;
    const d=cleanListing(L.id, snap.data()); if(!d || d.seller!==NET.me) return false;
    if(why==='sold' ? d.status!=='sold' : d.status!=='active') return false;
    await ref.delete();
    if(why==='sold'){ const g=Math.floor(d.price*(1-AH_CUT)); S.gold+=g; log(`Auction sold: ${listName(d)} to ${d.buyerName||'a buyer'} for ${fmt(d.price)} gold. You receive ${fmt(g)}.`, '#f3c95a'); toast(`Auction sold: +${fmt(g)} gold`); ahHist(`Sold ${listName(d)} to ${d.buyerName||'a buyer'} for ${fmt(d.price)}`); }

    log(snap?'Game updated. Your adventure continues.':`Welcome back to ${ZONES[S.zone].n}.`, '#f3c95a');
    if(!snap) applyOffline(saved.lastSaved||Date.now());
  } else { S=fresh(); renderCreate(); }
  resize(); hud(); renderPanel(true);
  initNet();
  requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
